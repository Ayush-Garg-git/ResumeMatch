spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_ENABLED:false}

eureka:
  client:
    enabled: false

app:
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    jd-queue: "jd.analysis.queue"
    jd-exchange: "jd.analysis.exchange"
    jd-routing-key: "jd.analysis.routingKey"
  jwt:
    secret: ${JWT_SECRET:3cfa76f28682c3c43217424874213768241387642138764812376481237468231}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: "./uploads"
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"
